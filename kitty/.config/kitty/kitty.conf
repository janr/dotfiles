# Meslo is installed locally and provides the glyphs used by the Bash prompt.
font_family MesloLGL Nerd Font
font_size 14.0

# Give the terminal a little breathing room without wasting screen space.
window_padding_width 10
placement_strategy top-left
draw_minimal_borders yes
active_border_color #89b4fa
inactive_border_color #313244

cursor_shape beam
cursor_blink_interval 0
shell_integration enabled
strip_trailing_spaces smart

enable_audio_bell no
confirm_os_window_close 0
copy_on_select yes

include themes/noctalia.conf
