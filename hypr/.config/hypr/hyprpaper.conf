# ~/.config/hypr/hyprpaper.conf
# Your Awesome config used: /home/$USER/.config/awesome/wp.png
# hyprpaper does not expand $USER inside paths reliably, so use an absolute path.
# Replace jan with your username if needed.
splash = false
preload = /home/jan/.config/hypr/wallpapers/dark_cubes.jpg

wallpaper {
    monitor =
    path = /home/jan/.config/hypr/wallpapers/dark_cubes.jpg
    fit_mode = cover
}
