# ~/.config/hypr/hyprland.conf
# Generated from your AwesomeWM rc.lua.
# Notes:
# - Awesome tags 1-9 become Hyprland workspaces 1-9.
# - Awesome's wibar/menu/widgets need external tools. This config uses Waybar, wofi, hyprpaper, and swaync/mako-style notifications.
# - Replace terminal/browser/menu commands below if your system uses different programs.

$mod = SUPER
$terminal = kitty
$menu = wofi --show run
$browser = zen

# Cursor theme
env = PATH,$HOME/.local/kitty.app/bin:$HOME/.local/bin:$PATH
env = HYPRCURSOR_THEME,Yaru
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Yaru
env = XCURSOR_SIZE,24

# -------------------------------------------------------------------
# Monitors / scale
# Your Awesome config forced DPI 192, which usually corresponds to 2x scale.
# Desk layout: main Acer landscape display on the left, secondary Samsung
# portrait display on the right. At 2x scale the Acer is 1920x1080 logical
# pixels and the rotated Samsung is 1080x1920. The Acer is vertically offset
# to approximate the physical placement: about 7 inches below the Samsung top.
monitor = desc:Acer Technologies Acer RT280K 0x71803C91, preferred, 0x360, 2
monitor = desc:Samsung Electric Company LU28R55 HCJW907260, preferred, 1920x0, 2, transform, 1

# Laptop panel is disabled for the desk layout so it does not overlap the
# external monitors. Comment this out if you want to use the laptop display.
monitor = eDP-1, disable
monitor = , preferred, auto-right, 2

# -------------------------------------------------------------------
# Autostart
exec-once = ~/.config/hypr/scripts/update-waybar
exec-once = hyprpaper
exec-once = ~/.config/hypr/scripts/awesome-workspaces watch
exec-once = sh -c 'pgrep -u "$USER" -x nm-applet >/dev/null || nm-applet'
exec-once = sh -c 'pgrep -u "$USER" -x zen >/dev/null || zen'

# Pick one notification daemon if you install it:
# exec-once = swaync
# exec-once = mako

# -------------------------------------------------------------------
# Input / focus behavior
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
}

# Focus follows mouse, roughly matching your Awesome "mouse::enter" signal.
misc {
    focus_on_activate = true
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# -------------------------------------------------------------------
# Look and feel
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 2

    # Awesome default-ish border colors.
    col.active_border = rgba(535d6cff)
    col.inactive_border = rgba(222222aa)

    layout = master
}

decoration {
    rounding = 6

    active_opacity = 1.0
    inactive_opacity = 0.8

    blur {
        enabled = true
        size = 25
        new_optimizations = true
    }

    shadow {
        enabled = false
    }

    glow {
        enabled = true
        color = rgba(535d6c66)
    }
}

animations {
    enabled = true

    bezier = fast, 0.05, 0.9, 0.1, 1.0

    animation = windows, 1, 3, fast
    animation = windowsOut, 1, 3, fast, popin 80%
    animation = border, 1, 5, fast
    animation = fade, 1, 3, fast
    animation = workspaces, 1, 3, fast
}

master {
    new_status = slave
    mfact = 0.5
}

# -------------------------------------------------------------------
# Window rules
# Awesome had titlebars disabled globally; Hyprland has no titlebars by default.

# Floating clients from your Awesome rules.
windowrule = float on, match:class ^(DTA|copyq|pinentry|Arandr|Blueman-manager|Gpick|Kruler|MessageWin|Sxiv|Tor Browser|Wpa_gui|veromix|xtightvncviewer)$

# Volume control
windowrule = float on, match:class ^(pavucontrol|Pavucontrol)$
windowrule = center on, match:class ^(pavucontrol|Pavucontrol)$
windowrule = float on, match:title ^(Volume Control)$
windowrule = center on, match:title ^(Volume Control)$
# Best-effort title/role equivalents from Awesome.
windowrule = float on, match:title ^(Event Tester|AlarmWindow|ConfigManager|pop-up)$
windowrule = center on, match:title ^(Event Tester|AlarmWindow|ConfigManager|pop-up)$

# File chooser / file picker dialogs
windowrule = float on, match:title ^(Open File|Open Files|Save File|Save As|Select File|Choose File|File Upload)$
windowrule = center on, match:title ^(Open File|Open Files|Save File|Save As|Select File|Choose File|File Upload)$

windowrule = float on, match:class ^(xdg-desktop-portal-gtk|xdg-desktop-portal-gnome|zenity)$
windowrule = center on, match:class ^(xdg-desktop-portal-gtk|xdg-desktop-portal-gnome|zenity)$

# cheetsheets
windowrule {
    name = nvim-cheatsheet-float
    match:title = Neovim Cheatsheet

    float = true
    center = true
    size = 1200 720
    pin = true
}

windowrule {
    name = hyprland-cheatsheet-float
    match:title = Hyprland Cheatsheet

    float = true
    center = true
    size = 1200 720
    pin = true
}

windowrule {
    name = pi-cheatsheet-float
    match:title = Pi Cheatsheet

    float = true
    center = true
    size = 1200 720
    pin = true
}

# -------------------------------------------------------------------
# Global keybindings translated from rc.lua

# Workspaces: Awesome-style per-monitor tags. Laptop-open: eDP-1 uses 1-9, first external uses 10-18, and second external uses 19-27. Laptop-lid-closed/docked: eDP-1 is disabled; externals shift down to 1-9 and 10-18.
bind = $mod, Left, exec, ~/.config/hypr/scripts/awesome-workspaces prev
bind = $mod, Right, exec, ~/.config/hypr/scripts/awesome-workspaces next
bind = $mod, Up, exec, ~/.config/hypr/scripts/awesome-workspaces first-empty
bind = $mod, Down, exec, ~/.config/hypr/scripts/awesome-workspaces last-empty
bind = $mod CTRL, Left, exec, ~/.config/hypr/scripts/awesome-workspaces external-prev
bind = $mod CTRL, Right, exec, ~/.config/hypr/scripts/awesome-workspaces external-next
bind = $mod, Escape, workspace, previous

# Move the focused window to the previous/next workspace on this monitor.
bind = $mod SHIFT, Left, movetoworkspace, r-1
bind = $mod SHIFT, Right, movetoworkspace, r+1
bind = $mod SHIFT, Up, exec, ~/.config/hypr/scripts/awesome-workspaces move-first-empty
bind = $mod SHIFT, Down, exec, ~/.config/hypr/scripts/awesome-workspaces move-last-empty

# Focus next/previous window. Hyprland order differs from Awesome's client index.
bind = $mod, J, cyclenext
bind = $mod, K, cyclenext, prev
bind = $mod, Tab, cyclenext, prev

# Swap windows
bind = $mod SHIFT, J, swapnext
bind = $mod SHIFT, K, swapnext, prev

# Focus monitors
bind = $mod CTRL, J, focusmonitor, +1
bind = $mod CTRL, K, focusmonitor, -1

# Swap all windows in the focused display's 9-workspace bank with the main
# display's bank (10-18 <-> 1-9, or 19-27 <-> 1-9).
bind = $mod CTRL, O, exec, ~/.config/hypr/scripts/awesome-workspaces swap-main

# Standard programs / session
bind = $mod, Return, exec, $terminal
bind = $mod CTRL, R, exec, ~/.config/hypr/scripts/restart-session
bind = $mod, Q, exit

# Logarithmic display brightness
binde = $mod, F5, exec, log-brightness down
binde = $mod, F6, exec, log-brightness up

# Layout manipulation
# In Awesome: mod+h/l changed master width factor.

# Awesome had nmaster/ncol controls. These only apply cleanly to Hyprland's master layout.
bind = $mod SHIFT, L, layoutmsg, removemaster
bind = $mod CTRL, H, layoutmsg, orientationleft
bind = $mod CTRL, L, layoutmsg, orientationright

# Toggle between the default left master and a top master with a horizontal
# first split. Both use the configured master factor.
bind = $mod SHIFT, Space, layoutmsg, orientationcycle left top
bind = $mod CTRL, Space, togglefloating

# Run prompt. Awesome's Lua prompt has no equivalent.
bind = $mod, R, exec, $menu

# Client/window bindings
bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, C, killactive
bind = $mod, Space, layoutmsg, swapwithmaster
bind = $mod, O, movewindow, mon:+1
bind = $mod, T, pin
#bind = $mod, N, movetoworkspacesilent, special:minimized
#bind = $mod CTRL, N, togglespecialworkspace, minimized
bind = $mod, M, fullscreen, 1
bind = $mod CTRL, M, fullscreenstate, 2 0
bind = $mod SHIFT, M, fullscreenstate, 3 0

# Mouse bindings, equivalent to Awesome mod+left move / mod+right resize.
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Workspace/tag bindings: view, move active window, and toggle on focused window.
bind = $mod, 1, exec, ~/.config/hypr/scripts/awesome-workspaces switch 1
bind = $mod, 2, exec, ~/.config/hypr/scripts/awesome-workspaces switch 2
bind = $mod, 3, exec, ~/.config/hypr/scripts/awesome-workspaces switch 3
bind = $mod, 4, exec, ~/.config/hypr/scripts/awesome-workspaces switch 4
bind = $mod, 5, exec, ~/.config/hypr/scripts/awesome-workspaces switch 5
bind = $mod, 6, exec, ~/.config/hypr/scripts/awesome-workspaces switch 6
bind = $mod, 7, exec, ~/.config/hypr/scripts/awesome-workspaces switch 7
bind = $mod, 8, exec, ~/.config/hypr/scripts/awesome-workspaces switch 8
bind = $mod, 9, exec, ~/.config/hypr/scripts/awesome-workspaces switch 9

bind = $mod SHIFT, 1, exec, ~/.config/hypr/scripts/awesome-workspaces move 1
bind = $mod SHIFT, 2, exec, ~/.config/hypr/scripts/awesome-workspaces move 2
bind = $mod SHIFT, 3, exec, ~/.config/hypr/scripts/awesome-workspaces move 3
bind = $mod SHIFT, 4, exec, ~/.config/hypr/scripts/awesome-workspaces move 4
bind = $mod SHIFT, 5, exec, ~/.config/hypr/scripts/awesome-workspaces move 5
bind = $mod SHIFT, 6, exec, ~/.config/hypr/scripts/awesome-workspaces move 6
bind = $mod SHIFT, 7, exec, ~/.config/hypr/scripts/awesome-workspaces move 7
bind = $mod SHIFT, 8, exec, ~/.config/hypr/scripts/awesome-workspaces move 8
bind = $mod SHIFT, 9, exec, ~/.config/hypr/scripts/awesome-workspaces move 9

# Escape hatch for the 10-18 workspace bank after disconnects. These are
# normally selected automatically on the secondary monitor, but can be reached
# directly with Super+Ctrl if Hyprland leaves them appended elsewhere.
bind = $mod CTRL, 1, workspace, 10
bind = $mod CTRL, 2, workspace, 11
bind = $mod CTRL, 3, workspace, 12
bind = $mod CTRL, 4, workspace, 13
bind = $mod CTRL, 5, workspace, 14
bind = $mod CTRL, 6, workspace, 15
bind = $mod CTRL, 7, workspace, 16
bind = $mod CTRL, 8, workspace, 17
bind = $mod CTRL, 9, workspace, 18

bind = $mod CTRL SHIFT, 1, movetoworkspace, 10
bind = $mod CTRL SHIFT, 2, movetoworkspace, 11
bind = $mod CTRL SHIFT, 3, movetoworkspace, 12
bind = $mod CTRL SHIFT, 4, movetoworkspace, 13
bind = $mod CTRL SHIFT, 5, movetoworkspace, 14
bind = $mod CTRL SHIFT, 6, movetoworkspace, 15
bind = $mod CTRL SHIFT, 7, movetoworkspace, 16
bind = $mod CTRL SHIFT, 8, movetoworkspace, 17
bind = $mod CTRL SHIFT, 9, movetoworkspace, 18

bind = $mod CTRL SHIFT, P, pin
bind = $mod SHIFT, H, exec, google-chrome --app=file://$HOME/.local/share/cheatsheets/hyprland.html
bind = $mod SHIFT, N, exec, google-chrome --app=file://$HOME/.local/share/cheatsheets/nvim.html
bind = $mod SHIFT, P, exec, google-chrome --app=file://$HOME/.local/share/cheatsheets/pi.html

# Awesome equivalent: Mod+u jump to urgent client
bind = $mod, U, focusurgentorlast

# Awesome equivalent: Mod+h / Mod+l change master width factor
bind = $mod, H, layoutmsg, mfact -0.05
bind = $mod, L, layoutmsg, mfact +0.05
